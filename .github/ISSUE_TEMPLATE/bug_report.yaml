name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: ["bug"]
type: bug
body:
    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: Tell us, what's wrong and what did you expect to happen.
          placeholder: Tell us what you see!
      validations:
          required: true
    - type: textarea
      id: erroroutput
      attributes:
          label: Relevant error output
          description: Please copy and paste any relevant log output or error codes.
          render: shell
    - type: textarea
      id: addinfo
      attributes:
          label: Additional Info
          description: Any info you think might help.
      validations:
          required: false
